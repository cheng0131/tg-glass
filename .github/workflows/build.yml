
name: Build Liquid Glass Telegram
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Clone Telegram
        run: |
          git clone --depth 1 https://github.com/DrKLO/Telegram.git tg
          cd tg && git submodule update --init --recursive --depth 1
      - name: Patch
        run: cd tg && git apply ../tg-glass-patch.patch
      - name: Build
        run: cd tg && chmod +x gradlew && ./gradlew :TMessagesProj_App:assembleAfatRelease --no-daemon -Dorg.gradle.jvmargs=-Xmx6g
      - uses: actions/upload-artifact@v4
        with:
          name: liquid-glass-apk
          path: tg/TMessagesProj_App/build/outputs/apk/**/*.apk
